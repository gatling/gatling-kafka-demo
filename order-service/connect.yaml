# The order service the simulations load: a Redpanda Connect pipeline (https://docs.redpanda.com/redpanda-connect/).
# It reads each order from the orders topic, then writes:
# - a confirmation on order-confirmations, the reply the simulations' requestReply waits for;
# - an event on order-events, the downstream record the simulations' expect waits for.
# Both keep the order's record key, which the simulations match the records with, and its channel header.

input:
  redpanda:
    seed_brokers: [ "kafka:19092" ]
    topics: [ "orders" ]
    consumer_group: order-service

output:
  broker:
    pattern: fan_out
    outputs:
      - redpanda:
          seed_brokers: [ "kafka:19092" ]
          topic: order-confirmations
          key: ${! @kafka_key }
          metadata:
            include_patterns: [ "^channel$" ]
        processors:
          - mapping: |
              root.orderId = this.orderId
              root.status = "ACCEPTED"
              root.totalCents = this.quantity * this.unitPriceCents

      - redpanda:
          seed_brokers: [ "kafka:19092" ]
          topic: order-events
          key: ${! @kafka_key }
          metadata:
            include_patterns: [ "^channel$" ]
        processors:
          - mapping: |
              root.orderId = this.orderId
              root.type = "ORDER_SHIPPED"
              root.shippedAt = now()
